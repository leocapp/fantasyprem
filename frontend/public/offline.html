<!doctype html>
<!--
  Plain HTML in public/, not a Next route.

  The service worker caches this at install time, so it has to render without a
  session, without the database, and without the navigation — all three of which
  a Next page in this app would try to fetch. Keeping it outside the framework
  is what makes it reliable on the one occasion it is needed.

  Colours are copied from globals.css rather than imported. That is a real
  duplication, and the reason is the same: a stylesheet is one more thing that
  has to have been cached.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · FatBoysFantasy</title>
    <style>
      :root {
        --bg: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #34d399;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.95rem; line-height: 1.5; max-width: 22rem; }
      button {
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.1rem;
        background: var(--accent);
        color: #04231a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No connection</h1>
      <p>
        Scores, lineups and deadlines all come from the server, so there is
        nothing worth showing you from memory — it would be out of date in a way
        you couldn't see.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
