name: Scheduled ingestion and scoring

on:
  schedule:
    # Hourly. Cheap enough to run always, and means points appear within an
    # hour of a match finishing without anyone thinking about it.
    - cron: "17 * * * *"
  # Lets you trigger a run by hand from the Actions tab, which is how you'll
  # test it and how you'll recover if a run fails.
  workflow_dispatch:

concurrency:
  # Two overlapping runs would fight over the same upserts.
  group: scheduled-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ingestion, scoring and trade settlement
        working-directory: backend
        env:
          ENVIRONMENT: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m app.ingest.cron
