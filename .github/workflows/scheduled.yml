name: Scheduled ingestion and scoring

on:
  schedule:
    # All times UTC. GitHub treats scheduled runs as best-effort and drops them
    # when its shared runners are busy — in practice roughly one in three fires.
    # These are set more aggressively than the target refresh rate to compensate.

    # Baseline: hourly, every day.
    - cron: "17 * * * *"

    # Match days: every 20 minutes on Saturday and Sunday, when people are
    # actually watching their scores move.
    - cron: "*/20 * * * 6,0"

    # Midweek and Friday evening kickoffs, 17:00–23:00 UTC.
    - cron: "*/30 17-23 * * 1-5"

  # Lets you trigger a run by hand from the Actions tab, which is how you'll
  # test it and how you'll recover if a run fails.
  workflow_dispatch:

concurrency:
  # Two overlapping runs would fight over the same upserts, so only one at a
  # time. Newer runs cancel older ones rather than queueing behind them: this
  # job refreshes state rather than accumulating it, so the most recent run is
  # always the one worth having, and a run stuck waiting for a runner would
  # otherwise block every run after it.
  group: scheduled-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Was 8, on the assumption the work took under a minute. It doesn't when
    # Sportmonks is slow: a measured run spent 119s on squads, 201s on the
    # sidelined lists and 135s on fixtures, for 469s total. Being killed
    # part-way through writing is a worse outcome than a slow run.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ingestion, scoring and trade settlement
        working-directory: backend
        env:
          ENVIRONMENT: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          # Optional: without it the reminder step is a no-op.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m app.ingest.cron
